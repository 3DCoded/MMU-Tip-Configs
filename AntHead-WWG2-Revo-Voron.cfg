[metadata]
toolhead: AntHead
extruder: WristWatch G2
hotend: Revo Voron
is_cut_tip: 1
author: TheMeanCanEHdian
notes: Using Blobifier and Crossbow, results were measure twice. 

  The Anthead fan duct collides with the Blobifier body before the nozzle can touch the tray. Seems to be a gap at the start of the first blob after a filament load outside a print (sequential blobs are perfect), however during a print was much more regular.

  There is room for additional Blobifier tuning.

[gcode_macro _MMU_CUT_TIP_VARS]
_file: mmu_macro_vars.cfg
variable_blade_pos: 65
variable_retract_length: 58
variable_pushback_length: 30

[mmu]
_file: mmu_parameters.cfg
form_tip_macro: _MMU_CUT_TIP
toolhead_extruder_to_nozzle: 91
toolhead_sensor_to_nozzle: 75
toolhead_entry_to_extruder: 13.6
toolhead_residual_filament: 9
toolhead_ooze_reduction: 0
