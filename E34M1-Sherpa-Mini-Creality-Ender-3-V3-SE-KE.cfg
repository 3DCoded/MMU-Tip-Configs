[metadata]
toolhead: E34M1
extruder: Sherpa Mini
hotend: Creality Ender 3 V3 SE/KE
is_cut_tip: 1
is_form_tip: 0
author: xlnzee
notes:
    You need a stack like this:

    Sherpa Mini with Extruder & Toolhead sensors, Filament cutter plus mounting plate/adapter from [here](https://www.printables.com/model/1828398-e34m1-sherpa-mini-filament-cutter-sensor-mod).

[mmu]
toolhead_sensor_to_nozzle: 92
toolhead_entry_to_extruder: 18
toolhead_residual_filament: 8
toolhead_ooze_reduction: 4
_file: mmu_parameters.cfg

[gcode_macro _MMU_FORM_TIP_VARS]
variable_retract_length: 66
variable_pushback_length: 55
variable_pushback_dwell_time: 0
variable_travel_speed: 150
variable_cut_fast_move_speed: 35
variable_cut_slow_move_speed: 35
_file: mmu_macro_vars.cfg

