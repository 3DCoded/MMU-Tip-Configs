[metadata]
toolhead: A4T
extruder: Wristwatch BMG
hotend: Dragon Ace Volcano with MZE
author: cwiegert
notes: Uses crossbow filament cutter
is_cut_tip: 1

[gcode_macro _MMU_CUT_TIP_VARS]
_file: mmu_macro_vars.cfg
variable_blade_pos              : 70.85	
variable_retract_length        : 60
variable_simple_tip_forming     : True
variable_rip_length             : 1.0		; Distance in mm to retract to aid lever decompression (>= 0)
variable_rip_speed              : 40		; Speed mm/s
variable_pushback_length        : 38		; TUNE ME: PTFE tube length + 3mm is good starting point
variable_pushback_dwell_time    : 0
variable_extruder_move_speed    : 20

[mmu]
_file: mmu_parameters.cfg
toolhead_extruder_to_nozzle: 89.5
toolhead_sensor_to_nozzle: 76.5
toolhead_entry_to_extruder: 9
toolhead_residual_filament: 44.9       # yes, that's right... it's a choker
toolhead_ooze_reduction: 2
form_tip_macro: _MMU_CUT_TIP
